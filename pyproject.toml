[project]
name = "weather-service-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6.5",
    "dotenv>=0.9.9",
    "fastapi>=0.118.3",
    "httpx[http2]>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.2.11",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.12.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "starlette>=0.27",
    "uvicorn[standard]>=0.37.0",
    "zitadel-client>=4.1.0b7",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 124

[tool.ruff.lint]
select = ["E", "F", "ANN"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]

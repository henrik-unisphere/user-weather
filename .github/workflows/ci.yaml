name: CI (uv)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # für GHCR push per GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    # dein Ziel-Image
    env:
      IMAGE_NAME: ghcr.io/henrik-unisphere/user-weather/user_weather

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies (locked, all groups)
        run: uv sync --all-groups --frozen

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

      # Buildx für GHA-Cache (docker-container driver)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # nur bei Push auf main pushen (PRs/Feature-Branches: kein Push)
      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_IMAGE=python:3.13-slim


name: CI (uv)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # 1) Lint & Tests: läuft auf allen Branches und PRs
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies (all groups, locked)
        run: uv sync --all-groups --frozen

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  # 2) Build & Push Docker-Image: nur auf push nach main, nach erfolgreichen Tests
  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/henrik-unisphere/user-weather/user_weather


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # optional: platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_IMAGE=python:3.13-slim
